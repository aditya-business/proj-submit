<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll Animation</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overscroll-behavior: none;
    scrollbar-width: none;          /* Firefox */
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }  /* Chrome / Safari */

  /* The scroll track: its height decides how much scrolling the 300 frames span */
  #track { height: 1000vh; }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    background: #000;
    opacity: 0;
    transition: opacity .9s ease;
  }
  canvas.ready { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="track"></div>

<script>
(() => {
  'use strict';

  const FRAME_COUNT = 300;
  const PATH = i => `frames/frame_${String(i + 1).padStart(4, '0')}.jpg`;

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const frames = new Array(FRAME_COUNT).fill(null);   // loaded <img> elements
  const decoded = new Uint8Array(FRAME_COUNT);         // 1 = pre-decoded and warm
  let vw = 0, vh = 0, dpr = 1;

  /* ---------- sizing ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth;
    vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.imageSmoothingQuality = 'high';
    lastDrawKey = '';
  }
  window.addEventListener('resize', resize);

  /* ---------- drawing (cover-fit) ---------- */
  function drawImage(img, alpha) {
    const cw = canvas.width, ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const s = Math.max(cw / iw, ch / ih);
    const w = iw * s, h = ih * s;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  // nearest loaded frame to index i (so scrubbing never shows a blank)
  function nearest(i) {
    if (frames[i]) return i;
    for (let d = 1; d < FRAME_COUNT; d++) {
      if (i - d >= 0 && frames[i - d]) return i - d;
      if (i + d < FRAME_COUNT && frames[i + d]) return i + d;
    }
    return -1;
  }

  let lastDrawKey = '';
  function render(pos) {
    const a = Math.min(FRAME_COUNT - 1, Math.max(0, Math.floor(pos)));
    const b = Math.min(FRAME_COUNT - 1, a + 1);
    let t = pos - a;
    if (t < 0.002) t = 0;

    const ia = nearest(a);
    if (ia < 0) return;
    const ib = t > 0 ? nearest(b) : -1;

    const key = ia + '|' + ib + '|' + t.toFixed(3);
    if (key === lastDrawKey) return;
    lastDrawKey = key;

    drawImage(frames[ia], 1);                    // base frame
    if (ib >= 0 && ib !== ia) drawImage(frames[ib], t);   // sub-frame blend toward the next
    ctx.globalAlpha = 1;
  }

  /* ---------- scroll → smoothed position ---------- */
  let target = 0;      // where the scroll says we should be (0..FRAME_COUNT-1)
  let current = 0;     // eased value actually rendered
  let last = performance.now();

  function readScroll() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    target = p * (FRAME_COUNT - 1);
  }
  window.addEventListener('scroll', readScroll, { passive: true });

  /* ---------- keep a window of frames decoded ahead of time ---------- */
  function warm(center) {
    const R = 36;
    const lo = Math.max(0, Math.floor(center) - R);
    const hi = Math.min(FRAME_COUNT - 1, Math.floor(center) + R);
    for (let i = lo; i <= hi; i++) {
      const img = frames[i];
      if (img && !decoded[i]) {
        decoded[i] = 1;
        img.decode().catch(() => {});
      }
    }
    // release far-away flags so they can be re-warmed if the user scrolls back
    for (let i = 0; i < FRAME_COUNT; i++) {
      if (decoded[i] && (i < lo - 80 || i > hi + 80)) decoded[i] = 0;
    }
  }

  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    // frame-rate independent easing
    const k = 1 - Math.exp(-dt * 9);
    current += (target - current) * k;
    if (Math.abs(target - current) < 0.003) current = target;

    warm(current);
    render(current);
    requestAnimationFrame(tick);
  }

  /* ---------- loading: coarse-to-fine so scrubbing works immediately ---------- */
  function loadOrder() {
    const seen = new Set(), order = [];
    const push = i => { if (i < FRAME_COUNT && !seen.has(i)) { seen.add(i); order.push(i); } };
    push(0);
    for (const step of [60, 30, 15, 6, 3, 1]) {
      for (let i = 0; i < FRAME_COUNT; i += step) push(i);
    }
    push(FRAME_COUNT - 1);
    return order;
  }

  function loadFrame(i) {
    return new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => { frames[i] = img; lastDrawKey = ''; resolve(); };
      img.onerror = () => resolve();
      img.src = PATH(i);
    });
  }

  async function loadAll() {
    const order = loadOrder();
    let cursor = 0;

    // first frame, then reveal immediately
    await loadFrame(order[cursor++]);
    canvas.classList.add('ready');

    const workers = Array.from({ length: 6 }, async () => {
      while (cursor < order.length) await loadFrame(order[cursor++]);
    });
    await Promise.all(workers);
  }

  /* ---------- go ---------- */
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  resize();
  readScroll();
  current = target;
  requestAnimationFrame(tick);
  loadAll();
})();
</script>
</body>
</html>
